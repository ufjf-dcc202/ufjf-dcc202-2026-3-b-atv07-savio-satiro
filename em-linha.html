<body>
    <main>
        <h1>DCC202 CSS Em linha</h1>
        <p>Você pode aplicar um estilo <em style="color: orange;">em linha</em> para um elemento usando o atributo <code style="color: lime; text-decoration: underline; font-family: sans-serif;">style</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera a cor do texto.</dd>
            </div>

            <div>
                <dt>background-color</dt>
                <dd>Altera a cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
