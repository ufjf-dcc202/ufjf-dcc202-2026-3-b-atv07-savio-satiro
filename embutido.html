<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC202 CSS Embutido</title>
    <style>
        em{
            color: orange;
        }

        code{
            color: lime; 
            text-decoration: underline; 
            /*font-family: sans-serif;*/
        }

        code#back{
            color: white;
            background-color: black;
        }
    </style>
</head>
<body>
    <main>
        <h1>DCC202 CSS Em linha</h1>
        <p>Você pode aplicar um estilo <em>embutido</em> para um elemento usando o elemento <code>style</code> no <code>head</code>.</p>

        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Altera a cor do texto.</dd>
            </div>

            <div>
                <dt><code id="back">background-color</code></dt>
                <dd>Altera a cor de fundo do elemento.</dd>
            </div>
        </dl>
    </main>
</body>
</html>
